name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Forbid reflection-based JSON
        run: |
          # Reflection serializers break under Blazor trimming; use a JsonSerializerContext.
          if grep -rnE 'JsonSerializer\.(Serialize|Deserialize)(Async)?<|(Get|Post|Put|Read)FromJsonAsync<' --include='*.cs' src tests; then
            echo "Use source-generated JsonTypeInfo instead of reflection-based JSON." >&2
            exit 1
          fi

      - name: Build
        run: dotnet build Firewall.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test Firewall.slnx -c Release --no-build

      - name: Publish (verifies the WebAssembly build)
        run: dotnet publish src/Firewall.Web -c Release -o publish

      - name: Prepare for GitHub Pages (verifies the deploy step)
        run: tools/prepare_pages.sh publish/wwwroot "${{ github.event.repository.name }}"
