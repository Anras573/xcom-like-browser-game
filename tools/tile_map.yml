prop.tree.green.tl: [18, 6]
prop.tree.green.tr: [19, 6]
prop.tree.green.bl: [18, 7]
prop.tree.green.br: [19, 7]
prop.tree.orange.tl: [21, 6]
prop.tree.orange.tr: [22, 6]
prop.tree.orange.bl: [21, 7]
prop.tree.orange.br: [22, 7]
prop.bush.green: [20, 6]
prop.bush.small_green: [18, 8]
prop.bush.small_orange: [19, 8]
prop.plant.leaf: [20, 7]
prop.rock.0: [20, 8]
prop.rock.1: [21, 8]
prop.rock.2: [22, 8]
prop.armchair.green: [17, 16]
prop.armchair.orange: [17, 17]
